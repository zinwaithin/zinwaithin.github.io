<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <script src="fontawesome/js/all.min.js"></script>

    <script src="jquery-4.0.0.min.js"></script>
    <script src="script.js"></script>
</head>
<body>

    <!-- start header -->
    <header class="navbar">

        <div class="logo">IT Shop</div>

        <div class="nav-links">

            <a href="#" class="home-btn">Home</a>

            <div class="cart-icon">
                <a href="checkout.html">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="item-count">0</span>
                </a>
            </div>

        </div>

    </header>
    <!-- end header -->

    <!-- start body -->

    <main class="container">
        <div class="product-grid">
            
            <div class="product-card">
                <div class="img-box">
                    <img src="images/laptop.webp" alt="Laptop 1">
                </div>
                <div class="product-info">
                    <h3>Laptop 1</h3>
                    <p class="price">Price : 2300000 MMK</p>
                    <button class="add-to-cart addToCard" data-id="1" data-name="laptop 1" data-price="2300000">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="img-box">
                    <img src="images/laptop1.webp" alt="Laptop 2">
                </div>
                <div class="product-info">
                    <h3>Laptop 2</h3>
                    <p class="price">Price : 2000000 MMK</p>
                    <button class="add-to-cart addToCard" data-id="2" data-name="laptop 2" data-price="2000000">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="img-box">
                    <img src="images/laptop2.webp" alt="Laptop 3">
                </div>
                <div class="product-info">
                    <h3>Laptop 3</h3>
                    <p class="price">Price : 1900000 MMK</p>
                    <button class="add-to-cart addToCard" data-id="3" data-name="laptop 3" data-price="1900000">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="img-box">
                    <img src="images/laptop3.webp" alt="Laptop 4">
                </div>
                <div class="product-info">
                    <h3>Laptop 4</h3>
                    <p class="price">Price : 1850000 MMK</p>
                    <button class="add-to-cart addToCard" data-id="4" data-name="laptop 4" data-price="1850000">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="img-box">
                    <img src="images/ip14pro.webp" alt="iPhone 1">
                </div>
                <div class="product-info">
                    <h3>iPhone 1</h3>
                    <p class="price">Price : 3400000 MMK</p>
                    <button class="add-to-cart addToCard" data-id="5" data-name="iPhone 1" data-price="3400000">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="img-box">
                    <img src="images/ip14pro1.webp" alt="iPhone 2">
                </div>
                <div class="product-info">
                    <h3>iPhone 2</h3>
                    <p class="price">Price : 3200000 MMK</p>
                    <button class="add-to-cart addToCard" data-id="6" data-name="iPhone 2" data-price="3200000">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="img-box">
                    <img src="images/ip14pro2.webp" alt="iPhone 3">
                </div>
                <div class="product-info">
                    <h3>iPhone 3</h3>
                    <p class="price">Price : 3100000 MMK</p>
                    <button class="add-to-cart addToCard" data-id="7" data-name="iPhone 3" data-price="3100000">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="img-box">
                    <img src="images/ip14pro4.webp" alt="iPhone 4">
                </div>
                <div class="product-info">
                    <h3>iPhone 4</h3>
                    <p class="price">Price : 3000000 MMK</p>
                    <button class="add-to-cart addToCard" data-id="8" data-name="iPhone 4" data-price="3000000">Add to Cart</button>
                </div>
            </div>

        </div>
    </main>


    <!-- end body -->
    
</body>
</html>
