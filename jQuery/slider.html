<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.min.js"></script>
</head>
<body>
    <style>
        #click-me{
            max-width: 250px;
            background-color: black;
            color: white;
            text-align: center;
            padding: 5px 0;
            cursor: pointer;
            margin-bottom: 0;
        }

        #panel{
            max-width: 250px;
            background-color: #352b2b;
            color: white;
            text-align: center;
            padding: 50px 0 ;
            margin-top: 0;
            display: none;
        }
    </style>

    <p id="click-me">Click me</p>
    <p id="panel">Hello!</p>

    <script>
        $(document).ready(function(){
            // $("#click-me").click(function(){
            //     $("#panel").slideDown();
            // })

            // $("#click-me").click(function(){
            //     $("#panel").slideUp();
            // })

            $("#click-me").click(function(){
                $("#panel").slideToggle();
            })
        })
    </script>
    

</body>
</html>
