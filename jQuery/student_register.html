<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.min.js"></script>
</head>
<body>
    
    <div id="addStudent">
        <h3>Add New Student</h3>
        Name : <input type="text" name="name" id="name"><br><br>
        Email: <input type="email" name="email" id="email"><br><br>
        Phone: <input type="number" name="phone" id="phone"><br><br>
        Year: <select name="year" id="year">
            <option value="">Choose Year</option>
            <option value="First Year">First Year</option>
            <option value="Second Year">Second Year</option>
            <option value="Third Year">Third Year</option>
        </select><br><br>
        <button id="add">Add Student</button>
    </div>

    <h3>Students List</h3>
    <table border="1" cellspacing="0" cellpadding="20">
        <thead>
            <tr>
                <th>No.</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Year</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tbody">
           
        </tbody>
    </table>

    <script>
        $(document).ready(function(){
            $("#add").click(function(){
                // input ထဲက data တစ်ခုချင်းစီလက်ခံ

                let name = $('#name').val();
                let email = $('#email').val();
                let phone = $('#phone').val();
                let year = $('#year').val();

                console.log(name,email,phone,year);


                // လက်ခံထားတဲ့dataတွေကို object တည်ဆောက်

                let students = {
                    stu_name : name,
                    stu_email : email,
                    stu_phone : phone,
                    stu_year : year,
                }
                console.log(students);

                // variable အလွတ် ကြေငြာ
                let studentArray;

                // localStorage ထဲက data ကိုလက်ခံရယူ
                let studentData = localStorage.getItem('students_key');

                console.log('student data is '+studentData);
                
                // if သည် localStorage က null ဖြစ်နေတဲ့အချိန် တနည်းအားဖြင့် ဘာdata မှာ မရှိတဲ့အချိန်မှာလုပ်

                if(studentData == null) {
                    studentArray = [];
                }else{
                    // else က localStorage မှာ data ရှိမှ လုပ်မယ်
                    // ရှိတဲ့ data က string ဖြစ်နေလို့ JSON Array ပြောင်း 
                    studentArray = JSON.parse(studentData);
                }

                // localStorage ထဲမှာ ဘာမှမရှိသေးရင် array index 0 အနေနဲ့ variable studentArray ထဲကိုသိမ်းသွား
                // localStorage ထဲမှာ data ရှိခဲ့မယ်ဆိုရင်  variable studentArray ထဲကို next index 1 အနေနဲ့ သိမ်းသွားမှာ

                studentArray.push(students);
                console.log(studentArray);

                // array ကို JSON string ပြောင်း 
                let studentString = JSON.stringify(studentArray);
                console.log(studentString);

                // localStorage ထဲကို data ထည့်

                localStorage.setItem('students_key' , studentString);

                getData();
                
            })

            getData();
            function getData() {
                let studentData = localStorage.getItem('students_key');
                console.log(studentData);
                
                let stuArray = JSON.parse(studentData);
                console.log(stuArray);

                let data ='';
                let j = 1;
                $.each(stuArray,function (i, v) {
                    console.log("i is " + i);
                    console.log("v is " + v.stu_name);
                    let name = v.stu_name;
                    let email = v.stu_email;
                    let phone = v.stu_phone;
                    let year = v.stu_year;

                data+= ` <tr>
                <td>${j++}</td>
                <td>${name}</td>
                <td>${email}</td>
                <td>${phone}</td>
                <td>${year}</td>
                <td>
                    <button>Delete</button>
                    <button>Edit</button>
                </td>
               </tr> `;
                   
                    
                })
                $("#tbody").html(data);

                 
                
            }
        })
    </script>

</body>
</html>
