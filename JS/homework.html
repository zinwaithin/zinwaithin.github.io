<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Looping</h1>
    <script>
        
        let num = Number(prompt("Enter Number"));
        if(num) {
            for(let i = 1; i <= 10; i++){
            document.write(`${num} * ${i} = ${num * i} <br>`);
        }
    } 

    </script>
</body>
</html>
