<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Conditional</h1>

    <script>
         
         let num = prompt("Enter number");

         if(num < 10){
            document.write("this number is less than 10")
         }else if(num == 10){
            document.write("this number is equal to 10")

         }else{
            document.write("this number is greater than 10")

         }
    </script>
</body>
</html>
