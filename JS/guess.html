<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let count = 0;

        let num = Number(prompt("Enter Your Number"));
        count++;
        
        while(num !== 75){
        
        if(num < 75){
        num = Number(prompt(`Your number is small.Try again!`));

        }else if(num > 75){
        num = Number(prompt(`Your number is gread.Try again!`));

        }

        count++;

        }
        document.write(`Congratulations! Your number is True. You tried ${count} times`);


    </script>
</body>
</html>
