<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Looping</h1>

    <script>
        for(let i =0; i<3; i++){
            for(let k=0; k<=i; k++){
                document.write(`*`);
            }
            document.write(`<br>`);
        }

            document.write(`<br>`);

            document.write(`<br>`);

            document.write(`<br>`);


        for(let i= 5; i>0; i--){
            for(let k=1; k<=i; k++){
                document.write(`*`);

            }
            document.write(`<br>`);

        }
    </script>
</body>
</html>
