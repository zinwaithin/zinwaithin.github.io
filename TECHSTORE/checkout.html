        // ၂။ URL ကနေ ID ဖတ်ပြီး UI ထုတ်ခြင်း

            const id = params.get('id');
            const checkoutDiv = document.getElementById('checkout-item');
            const item = products[id];

            if (item) {
                checkoutDiv.innerHTML = `
                <div class="product-box d-flex align-items-center p-3 shadow-sm animate__animated animate__fadeIn">

                document.getElementById('order-form').style.display = 'none';
            }
        };


        function orderDone() {
            const phone = document.getElementById('user-phone').value.trim();
            const address = document.getElementById('user-address').value.trim();

            // URL ကနေ ပစ္စည်း ID ကို ယူပြီး ပစ္စည်းအမည်နဲ့ ဈေးနှုန်းကို ဆွဲထုတ်မယ်
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const item = products[id];

            if (phone === "" || address === "") {
                alert("မိတ်ဆွေ... ဖုန်းနံပါတ်နှင့် လိပ်စာကို ပြည့်စုံစွာ ဖြည့်စွက်ပေးပါ။");
                return;
            }

            // Telegram ဆီ ပို့မယ့် စာသားပုံစံကို တည်ဆောက်ခြင်း
            const message = `🛒 *Order New Item*%0A` +

                `📦 *Item:* ${item.name}%0A` +
                `💰 *Price:* ${item.price}%0A` +
                `📞 *Phone:* ${phone}%0A` +
                `🏠 *Address:* ${address}%0A` +
                `--------------------------`;

            // Telegram Link (မိတ်ဆွေရဲ့ Username ဆီ တန်းရောက်သွားစေမယ်)
            const telegramUrl = `https://t.me/zinwaithin06?text=${message}`;

            // Telegram App သို့မဟုတ် Web သို့ ပို့ပေးခြင်း
            window.open(telegramUrl, '_blank');
