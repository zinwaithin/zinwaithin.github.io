        /* --- Navbar Search (အမြဲတမ်း အဖြူရောင်စစ်စစ် Version) --- */
        .nav-search-wrapper {
            background-color: #ffffff !important;
            /* အစကတည်းက အဖြူရောင်ဖြစ်အောင် ပြင်လိုက်ပါတယ် */
            border-radius: 50px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            /* အဖြူပေါ်မှာ သိသာအောင် ဘောင်ပါးပါးလေး ထည့်ထားပါတယ် */
            max-width: 140px;
            height: 30px;
            transition: all 0.3s ease;
        }

        /* နှိပ်လိုက်ရင် အပြာရောင် Glow လေးလင်းလာမယ် */
        .nav-search-wrapper:focus-within {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
            max-width: 170px;
            /* နှိပ်လိုက်ရင် နည်းနည်းလေး ပိုကျယ်လာမယ် */
        }

        .nav-search-wrapper input {
            border: none !important;
            outline: none !important;
            background: transparent !important;
            padding: 4px;
            color: #333 !important;
            /* အဖြူပေါ်မှာမို့လို့ စာသားကို အမည်းရောင်ထားပါတယ် */
            font-size: 11px;
            width: 100%;
        }

        .nav-search-wrapper i {
            font-size: 11px;
            color: #666;
            /* မှန်ဘီလူး Icon ကို မီးခိုးရောင်ထားပါတယ် */
        }

        .nav-search-wrapper:focus-within i {
            color: #007bff;
            /* နှိပ်လိုက်ရင် Icon လေး အပြာရောင်ပြောင်းမယ် */
        }

        /* Search... ဆိုတဲ့စာသားအရောင် */
        .nav-search-wrapper input::placeholder {
            color: #999 !important;
        }

        /* --- Product Card Style --- */
        .product-card {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            height: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .product-img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            margin-bottom: 15px;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.08);
            /* Hover လုပ်ရင် ပုံလေး နည်းနည်းကြီးလာမယ် */
        }

        .price-text {
            color: #007bff;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        /* --- Category Buttons --- */
        .category-btn {
            border-radius: 50px;
            padding: 7px 22px;
            margin: 5px;
            border: 1px solid #007bff;
            background-color: #fff;
            color: #007bff;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .category-btn.active,
        .category-btn:hover {
            background-color: #007bff;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }

        /* --- Mobile Responsive --- */
        @media (max-width: 991px) {
            .nav-search-wrapper {
                max-width: 100px;
            }

                max-width: 130px;

            'cameras': { title: 'Photography Kit', items: [{ n: 'Camera Bag', i: 'fa-camera-retro' }, { n: '128GB SD Card', i: 'fa-sd-card' }] }
        };

        // ၃။ လက်ဆောင်များကို Render လုပ်မည့် Function
        function renderProductBundle(catName) {
            const container = document.getElementById('product-bundle-all');
            if (!container || !catName) return;
            const data = zinGyiBundles[catName.toLowerCase()];
            if (!data) return;

            let html = `
            <div class="p-3 border rounded-4 bg-white mb-4 shadow-sm" style="border-left: 5px solid #007bff !important;">
                <h6 class="fw-bold mb-3 text-primary"><i class="fas fa-gift me-2"></i>${data.title}</h6>
                <div class="row g-2">`;
            data.items.forEach(gift => {
                html += `
                <div class="col-6">
                    <div class="p-2 border rounded-3 bg-light text-center h-100">
                        <i class="fas ${gift.i} d-block mb-1 text-primary" style="font-size: 1.2rem;"></i>
                        <small class="fw-bold" style="font-size: 0.7rem;">${gift.n}</small>
                    </div>
                </div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        // --- Main Rendering Logic ---
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id')?.trim();
        const contentDiv = document.getElementById('detail-content');
        const item = products[id];

        if (item) {
            let specHTML = "";
            for (let key in item.specs) {
                specHTML += `<div class="d-flex justify-content-between border-bottom py-2"><span class="text-muted small">${key}</span><span class="fw-bold small">${item.specs[key]}</span></div>`;
            }

            // ညီလေးရဲ့ မူလ HTML Structure ကို ဒီမှာ ပြန်ထည့်ပါ
            contentDiv.innerHTML = `
        <div class="row g-0">
            <div class="col-md-6 p-4 text-center">
                <div class="main-img-container shadow-sm bg-white p-3 rounded-4">
                    <img id="main-img" src="${item.img}" class="img-fluid animate__animated animate__zoomIn">
                     <div class="detail-wishlist-btn" onclick="toggleWishlistDetail(this)" title="Add to Wishlist">
                        <i class="fas fa-heart fa-lg"></i>
                </div>


                </div>
            </div>
            <div class="col-md-6 p-4 p-lg-5">
                   <span class="badge bg-danger px-3 py-2 rounded-pill mb-3">HOT DEAL</span>
               
                <h1 class="fw-bold text-dark mb-2">${item.name}</h1>
                <h2 class="text-primary fw-bold mb-4">${item.price}</h2>
                
                <div id="product-bundle-all"></div> <div class="p-4 bg-light rounded-4 mb-4">
                    <h6 class="fw-bold border-bottom pb-2 mb-3"><i class="fas fa-list me-2"></i>Specifications</h6>
                    ${specHTML}
                </div>

                <div class="row g-3">
                    <div class="col-6"><button onclick="addToCart()" class="btn btn-primary w-100 py-3 fw-bold rounded-3">Add to Cart</button></div>
                    <div class="col-6"><button onclick="buyNow('${id}')" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow">Buy Now</button></div>
                    
                </div>
            </div>
        </div>`;


            //wishlist

            function toggleWishlistDetail(element) {
                // နှိပ်လိုက်ရင် Animation လေးဖြစ်သွားအောင်
                element.style.transform = "scale(1.4)";
                setTimeout(() => {
                    element.style.transform = "scale(1.1)";
                }, 200);

                // လောလောဆယ် Alert လေးနဲ့ ပြပေးထားမယ်
                console.log("Added to wishlist!");
            }




            // လက်ဆောင်ကို ခေါ်ထုတ်ခြင်း
            renderProductBundle(item.category);

        } else {
            contentDiv.innerHTML = `<div class="p-5 text-center"><h2>Product Not Found</h2><a href="index.html" class="btn btn-primary mt-3">Go Home</a></div>`;
        }

        function addToCart() { alert("ခြင်းတောင်းထဲသို့ ထည့်ပြီးပါပြီ!"); }
        function buyNow(productId) {
            const item = products[productId];
            window.location.href = `checkout.html?id=${productId}&name=${encodeURIComponent(item.name)}&price=${encodeURIComponent(item.price)}`;
        }
    </script>


    <style>
        /* Image Container ထဲမှာ Relative Position သတ်မှတ်ရန် */
        .main-img-container {
            position: relative;
            /* ဒါက မရှိမဖြစ် လိုအပ်ပါတယ် */
        }

        /* Wishlist Button ကို နေရာချခြင်း (ပုံရဲ့ အပေါ်ညာဘက်ထောင့်) */
        .detail-wishlist-btn {
            position: absolute;
            top: 15px;
            /* အပေါ်မှ အကွာအဝေး */
            right: 15px;
            /* ညာဘက်မှ အကွာအဝေး */
            z-index: 10;
            /* ပုံရဲ့ အပေါ်မှာ ပေါ်နေစေရန် */

            /* Wishlist Button Style */
            width: 35px;
            height: 35px;
            background: rgba(255, 255, 255, 0.8);
            /* နောက်ခံကို အကြည်လေးထားမယ် */
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ff4757;
            /* Heart အမြဲအနီရောင် */
            transition: all 0.4s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Hover တင်ရင် Glow လင်းလာမည့် Effect */
        .detail-wishlist-btn:hover {
            transform: scale(1.1);
            background: white;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.7);
            /* Glow Effect */
        }
    </style>
