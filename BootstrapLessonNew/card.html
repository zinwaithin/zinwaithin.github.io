<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <!--  -->
        <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    </head>
    <body>

        <h1 class="text-center my-5 text-danger">Card Image Top</h1>

        <div class="container">
            <div
                class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 row-cols-xl-5 g-4">
                <div class="col my-2">
                    <div class="card">
                        <img src="images/cartoon1.jpg" class="card-img-top"
                            alt="image">

                        <div class="card-body">
                            <h6 class="card-title">Product Name <span
                                    class="float-end">$250</span></h6>
                            <p class="card-text">Product Description</p>
                            <a href="#myModal"
                                class="btn btn-sm btn-success float-end"
                                data-bs-toggle="modal">View More</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!--  -->
        <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

<!-- Modal -->

<div class="modal fade" id="myModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Product Detail</h5>
                <button type="button" class="btn-close"
                    data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="container">
                    <div class="row row-cols-2">
                        <div class="col">
                            <img src="images/cartoon1.jpg" alt="image">
                        </div>

                        <div class="col">
                            <h6>Product Name</h6>
                            <h6>Product Description</h6>
                            <p>Lorem ipsum dolor sit amet consectetur
                                adipisicing elit. Adipisci necessitatibus
                                laborum quod, veniam debitis enim maxime
                                consectetur corporis in dolores?</p>
                        </div>
                    </div>
                </div>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">CLOSE</button>
                <button type="button" class="btn btn-primary">Buy Now</button>
            </div>

        </div>
    </div>
