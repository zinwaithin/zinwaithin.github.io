<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- bootstrap -->
     <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

    <h1 class="text-danger text-center">Form Lesson</h1>

    <div class="container">
        <div class="row">
            <div class="offset-lg-4 col-lg-4">
                <form action="" method="post">
                    <div class="mb-3">
                        <label for="photo" class="form-label">Photo</label>
                        <input type="file" name="photo" id="photo" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" name="name" id="name" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" name="email" id="email" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="number" name="phone" id="phone" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" name="date" id="date" class="form-control">
                    </div>

                    <label class="d-block mb-3 form-label">Gender</label>
                    <div class="form-check-inline">
                        <input type="radio" id="male" name="gender" class="form-check-input" value="male">
                        <label for="male" class="form-check-label">Male</label>
                    </div>
                    <div class="form-check-inline">
                        <input type="radio" id="male" name="gender" class="form-check-input" value="female">
                        <label for="female" class="form-check-label">Female</label>
                    </div>

                    <label class="d-block mb-3 form-label">Choose Education</label>
                    <select class="form-select mb-3">
                        <option value="0">High School</option>
                        <option value="1">College</option>
                        <option value="2">University</option>
                    </select>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea class="form-control"></textarea>
                    </div>


                    <button type="submit" class="btn btn-success float-end">Add</button>

                </form>
            </div>
        </div>
    </div>


    <!-- js -->
     <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
