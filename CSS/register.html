<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <h1>Register Form</h1>
    
    <form action="#" method="post" id="myForm">
        
        <div>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" value="Zin Wai Thin" readonly>
        </div>
        <br>

        <div>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email">
        </div>
        <br>

        <div>
            <label for="phone">Phone Number</label><br>
            <input type="number" id="phone" name="phone">
        </div>
        <br>

        <div>
            <label for="gender">Gender</label><br>

            <input type="radio" name="gender" id="male" value="male"><label for="male">Male</label><br>
            <input type="radio" name="gender" id="female" value="female"><label for="female">Female</label><br>
            <input type="radio" name="gender" id="other" value="other"><label for="other">Other</label><br>
        </div>
        <br><br>

        <div>
            <label for="hobby">Hobby</label><br>

            <input type="checkbox" name="hobby" id="reading" value="reading"><label for="reading">Reading</label><br>
            <input type="checkbox" name="hobby" id="swimming" value="swimming"><label for="swimming">Swimming</label><br>
            <input type="checkbox" name="hobby" id="cooking" value="cooking"><label for="cooking">Cooking</label><br>
            <input type="checkbox" name="hobby" id="singing" value="singing"><label for="Singing">singing</label><br>
            <input type="checkbox" name="hobby" id="playing" value="playing" disabled><label for="playing">Playing</label><br>
            <input type="checkbox" name="hobby" id="shopping" value="shopping"><label for="shopping">Shopping</label>
        </div>
        <br><br>

        <fieldset>
            <legend>Rules</legend>
            <ul>
                <li>This is the first rule</li>
                <li>This is the second rule</li>
                <li>This is the third rule</li>
                <li>This is the fourth rule</li>
                <li>This is the fifth rule</li>
                <li>This is the sixth rule</li>
                <li>This is the seventh rule</li>
            </ul>
        </fieldset>
        <br><br>

        <p></p>
        <p>Thank you for Registering</p>
        <p></p>
        <br><br>


        <button type="submit" class="register-btn">Submit</button>
    </form>
</body>
</html>
