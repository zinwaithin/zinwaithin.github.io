<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;  padding-bottom: 50px;">Restaurant Form</h1>

    <form action="" style="text-align: center; box-shadow: 15px 30px 45px rgba(21, 19, 19, 0.5); padding: 25px 30px; width: 50%; margin: auto;">

        <label for="foodname">Food Name</label><br>
        <input type="text" id="foodname" name="foodname" required><br><br>

        <label for="price">Price</label><br>
        <input type="number" id="price" name="price" required><br><br>

        <label for="quantity">Quantity</label><br>
        <input type="number" id="quantity" name="quantity" required><br><br>

        <button type="button" onclick="showData()">Register</button><br><br><br>
    </form>


    <h1 style="text-align: center; padding-top: 70px; ">Menu Lists</h1>
    <table border="1" cellpadding="20" cellspacing="0" align="center" style=" box-shadow: 15px 30px 45px rgba(21, 19, 19, 0.5);">
        <thead>
        <tr>
            <td>No.</td>
            <td>Food Name</td>
            <td>Price</td>
            <td>Quantity</td>
            <td>Total</td>
        </tr>
        </thead>

        <tbody id="tbody">
        </tbody>

        <tfoot id="tfoot">
        </tfoot><br><br><br>

    </table>

    <script>

       var menu =[];

        function showData(){
            //get input value
            let name = document.getElementById('foodname').value ;
            let price = Number(document.getElementById('price').value);
            let quantity = Number(document.getElementById('quantity').value);

           // console.log(name);
           // console.log(price);
          //  console.log(quantity);

          let list ={
            name : name,
            price : price,
            quantity : quantity,
          }

          //console.log(list);

          //array to store students
          menu.push(list);
         // console.log(menu);

         let html = '';
         let totalSum =0;
         for (let i = 0; i < menu.length; i++) {
            //console.log(menu[i]);

            let rowPrice = menu[i].price * menu[i].quantity;
            totalSum += rowPrice;
            html += `<tr>
                     <td>${i+1}</td>
                     <td>${menu[i].name}</td>
                     <td>${menu[i].price}</td>
                     <td>${menu[i].quantity}</td>
                     <td> ${rowPrice}</td>
                   </tr> `
                    }

                    document.getElementById('tbody').innerHTML = html;

            let htmltwo =`<tr>
                            <td colspan="4">Grand Total </td>
                            <td>${totalSum} </td>
                         </tr>`
                    document.getElementById('tfoot').innerHTML = htmltwo;

        }
    </script>
    
</body>
</html>
