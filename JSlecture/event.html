<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Event Lessons</h1>

    <img src="images/cake1.jpg" alt="" id="myImage" width="300" height="300" onmouseover="big()" onmouseleave="normal()">
    
    <input type="text" id="myInput" onkeyup="result()">
    <p id="result"></p>
    <script>

        //onmouseenter
        //onmouseover
        function big(){
            document.getElementById('myImage').style.width="500px";
            document.getElementById('myImage').style.height="500px";
        }

        //onmouseleave
        //onmouseout
        //onmouseexit
        //onmousedown

        function normal(){
             document.getElementById('myImage').style.width="300px";
            document.getElementById('myImage').style.height="300px";
        }

        function result(){
            let inputValue = document.getElementById('myInput').value;
            document.getElementById('result').innerText=inputValue;
        }

    </script>
</body>
</html>
