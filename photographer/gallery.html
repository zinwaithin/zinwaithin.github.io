<body>

    <section class="gallery">
    
    <div class="gallery_sidebar">
        <ul class="gallery_items">
            <li><a href="#portrait" class="gallery_item">Portrait Photos</a></li>
            <li><a href="#kid" class="gallery_item">Kid Photos</a></li>

    </div>

    <div class="gallery_content">

        <div id="portrait" class="gallery_box">
            <h1 class="about_title">Portrait Photos</h1>
            <hr class="section_line">
            <div class="photos_grid">
                <img src="images/1.jpg" alt="Portrait 1">
                <img src="images/2.jpg" alt="Portrait 2">

            <hr class="section_line">
            <div class="photos_grid">
                <img src="images/k1.jpg" alt="Kid 1">
                <img src="images/k2.jpg" alt="Kid 2">
                <img src="images/k3.jpg" alt="Kid 3">
                <img src="images/k4.jpg" alt="Kid 3">
                <img src="images/k5.jpg" alt="Kid 3">

                <img src="images/k8.jpg" alt="Kid 3">
                <img src="images/k9.jpg" alt="Kid 3">

        </div>

        <div id="couple" class="gallery_box">
            <h1 class="about_title">Couple Photos</h1>
            <hr class="section_line">
            <div class="photos_grid">
                <img src="images/c1.jpg" alt="Couple 1">
                <img src="images/c2.jpg" alt="Couple 2">
                <img src="images/c3.jpg" alt="Couple 3">
                <img src="images/c4.jpg" alt="Couple 3">
                <img src="images/c5.jpg" alt="Couple 3">
                <img src="images/c6.jpg" alt="Couple 3">
                <img src="images/c7.jpg" alt="Couple 3">
                <img src="images/c8.jpg" alt="Couple 3">
                <img src="images/c9.jpg" alt="Couple 3">
            </div>
        </div>

        <div id="wedding" class="gallery_box">
            <h1 class="about_title">Wedding Photos</h1>
            <hr class="section_line">
            <div class="photos_grid">
                <img src="images/w1.jpg" alt="Wedding 1">
                <img src="images/w2.jpg" alt="Wedding 2">
                <img src="images/w3.jpg" alt="Wedding 3">
